# mappings.json is generated from mappings.txt and committed beside it. Every
# consumer reads the JSON, so a row edited in the text file and not regenerated
# gives the agent an address that is simply wrong -- and a wrong address does
# not throw, it gives a hook that silently never fires.
#
# Coderpack's CI already runs this check, but it runs it against mappings at
# master, which is after the fact: a stale commit here is caught one repository
# downstream, once it has already landed. This job is the same check on the
# pull request that introduces it.
#
# There is nothing else to run. hooksafe.py, the other guard on these rows,
# reads bytes out of the installed game and cannot run on a runner.
name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No setup-python step: the generator is standard library only, and the
      # runner image already provides `python`, which is how coderpack's
      # workflow runs this same command.
      - name: mappings.json is current
        run: python mappings.generator.py --check
